{% extends "header.html" %}
{% block content %}

<div class="content-grid">
    <!-- LEFT CARD: Upload & Select -->
    <div class="ui-card card-left">
        <h2 class="card-title-left">Upload & Select</h2>

        <!-- Dashed Dropzone -->
        <div class="dropzone-area" id="dropzoneBox" onclick="triggerFileSelect()">
            <img id="imagePreviewEl" class="dropzone-preview" {% if img %}src="{{ url_for('static', filename=img) }}" style="display: block;"{% endif %} alt="Food Preview">
            
            <button type="button" class="dropzone-clear-btn" id="clearPreviewBtn" onclick="clearSelectedImage(event)" title="Remove image">
                <i class="fas fa-times"></i>
            </button>

            <div class="dropzone-content" id="dropzonePlaceholder" {% if img %}style="display: none;"{% endif %}>
                <div class="dropzone-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <p class="dropzone-text-main">Drag & Drop an image here</p>
                <p class="dropzone-text-sub">or click to browse</p>
            </div>
        </div>

        <!-- Inline Validation Error -->
        <p class="upload-inline-error" id="uploadErrorMsg">
            <i class="fas fa-exclamation-circle"></i> Choose a photo first.
        </p>

        <!-- Hidden Upload Form -->
        <form id="foodUploadForm" action="/" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input id="hiddenFileInput" type="file" hidden name="imagefile" accept="image/*">
        </form>

        <!-- Button 1: Primary Upload Button -->
        <button type="button" class="btn-primary-upload" id="submitUploadBtn" onclick="handleUploadSubmit()">
            <i class="fas fa-camera"></i>
            <span id="submitBtnText">Upload a Food Image</span>
        </button>

        <!-- Button 2: Secondary Sample Button -->
        <button type="button" class="btn-secondary-sample" data-toggle="modal" data-target="#sampleModal">
            Choose from Sample Image
        </button>
    </div>

    <!-- RIGHT CARD: Dynamic Content (Home Info or Recipe Predictions) -->
    {% block home %}{% endblock %}
</div>

<!-- Sample Dishes Modal -->
<div class="modal fade" id="sampleModal" tabindex="-1" role="dialog" aria-labelledby="sampleModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content modal-content-custom">
            <div class="modal-header modal-header-custom">
                <h5 class="modal-title modal-title-custom" id="sampleModalTitle">
                    <i class="fas fa-utensils" style="color: var(--accent-amber);"></i>
                    Choose a Sample Food Dish
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color: var(--text-muted); font-size: 24px; opacity: 0.8; text-shadow: none;">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body p-0">
                <div class="sample-grid">
                    <div class="sample-card-item">
                        <img src="{{ url_for('static', filename='images/burger.jpg') }}" alt="Burger" class="sample-card-img">
                        <div class="sample-card-body">
                            <h6 class="sample-card-name">Burger</h6>
                            <a href="{{ url_for('predictsample', samplefoodname='burger') }}" class="btn-sample-pick" onclick="handleSampleClick('burger.jpg')">Select & Predict</a>
                        </div>
                    </div>
                    <div class="sample-card-item">
                        <img src="{{ url_for('static', filename='images/chocolate-cake.jpg') }}" alt="Chocolate Cake" class="sample-card-img">
                        <div class="sample-card-body">
                            <h6 class="sample-card-name">Chocolate Cake</h6>
                            <a href="{{ url_for('predictsample', samplefoodname='chocolate-cake') }}" class="btn-sample-pick" onclick="handleSampleClick('chocolate-cake.jpg')">Select & Predict</a>
                        </div>
                    </div>
                    <div class="sample-card-item">
                        <img src="{{ url_for('static', filename='images/grilled-beef.jpg') }}" alt="Grilled Beef" class="sample-card-img">
                        <div class="sample-card-body">
                            <h6 class="sample-card-name">Grilled Beef</h6>
                            <a href="{{ url_for('predictsample', samplefoodname='grilled-beef') }}" class="btn-sample-pick" onclick="handleSampleClick('grilled-beef.jpg')">Select & Predict</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
